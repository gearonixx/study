<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iOS ignores the manifest's icons on the home screen and wants this one. -->
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="timeforces" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Ten focus blocks a day on a fixed clock, 10:00 to 21:50, and a GitHub-style graph of the hours you actually put in. Local-first."
    />
    <title>timeforces</title>
    <script>
      // Resolve the theme before first paint so a dark start never flashes white.
      try {
        var raw =
          localStorage.getItem('timeforces:db:v1') ||
          localStorage.getItem('study:db:v2') ||
          localStorage.getItem('wizzard:db:v1') ||
          localStorage.getItem('study:db:v1');
        var preset = (JSON.parse(raw || '{}').settings || {}).theme || 'system';
        var dark =
          preset === 'github-dark' ||
          (preset !== 'github-light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
