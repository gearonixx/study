<!doctype html>
<html lang="en" data-skin="github" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Twelve focus blocks a day, a fixed 60/10 timer, and a GitHub-style graph of the hours you actually put in. Local-first."
    />
    <title>study</title>
    <script>
      // Resolve the theme preset before first paint so there is no flash.
      try {
        var stored =
          localStorage.getItem('study:db:v2') ||
          localStorage.getItem('wizzard:db:v1') ||
          localStorage.getItem('study:db:v1') ||
          localStorage.getItem('study-wizzard:db:v1') ||
          localStorage.getItem('study-anythere:db:v1');
        var db = JSON.parse(stored || '{}');
        var preset = ((db && db.settings) || {}).theme || 'github-light';
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var skin = preset === 'claude' ? 'claude' : 'github';
        var theme =
          preset === 'github-dark'
            ? 'dark'
            : preset === 'github-light'
              ? 'light'
              : dark
                ? 'dark'
                : 'light';
        document.documentElement.dataset.skin = skin;
        document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
