name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, letting an in-progress run finish first.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must be a Node that ships npm 11: the lock file is written by npm
          # 11 locally, and npm 10 rejects it over peer dependencies of the
          # optional wasm32-wasi bindings that rolldown and oxlint carry.
          node-version: 24
          cache: npm

      - run: npm ci

      # Guards the vault: a day written to Markdown must parse back identically.
      - name: Check Markdown round-trip
        run: npm run check-roundtrip -- .github/fixtures

      # Guards the sync merge: the 2026-07-30 data loss, replayed, plus the
      # properties that stop the fix from over-correcting.
      - name: Check sync merge
        run: npm run check-merge

      # Guards the server's write guard: ordinary edits pass, a collapse doesn't.
      - name: Check write guard
        run: npm run check-guard

      # Guards both day shapes: the arithmetic, and a day that runs past midnight.
      - name: Check schedules
        run: npm run check-schedule

      - run: npm run build
        env:
          # Set the `VITE_API_BASE` repo secret to your Vercel API URL to turn on
          # GitHub cloud sync. Leave it unset and the app stays local-only.
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
